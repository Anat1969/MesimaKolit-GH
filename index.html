<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F6F6">
<meta name="description" content="מקליטים משפט אחד, והוא הופך למשימה ברשימה.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות קוליות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>משימות קוליות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="app.css">
<script src="https://appofapp-gh.vercel.app/ai-menu.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
</head>
<body>
<header class="bar" dir="rtl">
  <a class="brand" href="./">משימות קוליות</a>
  <span class="saved" id="saved" aria-live="polite"></span>
  <ai-menu phone chat="https://claude.ai/code/session_01UBnSCJX164CAgvhrgkuEge"></ai-menu>
</header>

<main id="main" dir="rtl">
  <section class="m widget rec" aria-label="הקלטה">
    <button class="m mic" type="button" id="record" aria-label="התחלת הקלטה">
      <span class="mic-dot" aria-hidden="true"></span>
    </button>
    <div class="rec-text">
      <div class="rec-title" id="rec-title">לחצי ודברי</div>
      <div class="rec-timer" id="timer" dir="ltr">00:00</div>
    </div>
  </section>

  <div class="tiles" dir="rtl">
    <div class="cell"><button class="m tile num" type="button" id="f-open" aria-pressed="true" aria-label="משימות פתוחות"><span id="n-open">0</span></button><span class="lbl">פתוחות</span></div>
    <div class="cell"><button class="m tile num" type="button" id="f-done" aria-pressed="false" aria-label="ארכיון"><span id="n-done">0</span></button><span class="lbl">בוצעו</span></div>
    <div class="cell"><button class="m tile" type="button" id="t-write" aria-label="כתיבת משימה"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button><span class="lbl">כתיבה</span></div>
    <div class="cell"><button class="m tile" type="button" id="t-sync" aria-label="סנכרון בין מכשירים"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8.5a4.5 4.5 0 0 1-.5 9.5z"/></svg><span class="dot" id="sync-dot" hidden></span></button><span class="lbl" id="sync-lbl">במכשיר</span></div>
  </div>

  <section class="m panel live" aria-label="תמלול">
    <div class="live-head"><span class="k" id="live-k">תמלול</span><span class="k soft" id="platform"></span></div>
    <div class="sunk live-box" id="live" aria-live="polite">מה שתגידי יופיע כאן, ויהפוך למשימה כשתעצרי.</div>
  </section>

  <section class="m panel list" aria-labelledby="list-title">
    <div class="list-head">
      <h2 id="list-title">משימות פתוחות</h2>
      <span class="k" id="list-count"></span>
    </div>
    <ul class="tasks" id="tasks"></ul>
  </section>
</main>

<form class="dock" id="dock" dir="rtl" autocomplete="off">
  <input id="quick" type="text" enterkeyhint="done" placeholder="או כתבי משימה" aria-label="כתיבת משימה" dir="rtl" maxlength="300">
  <button class="m go" type="submit" aria-label="הוספת משימה"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</form>

<div class="sheet-bg" id="sheet" hidden>
  <div class="m sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" dir="rtl">
    <h2 id="sheet-title">סנכרון בין מכשירים</h2>
    <p class="k">בלי כניסה, המשימות נשמרות רק במכשיר הזה.<br>אחרי כניסה הן זמינות בכל מכשיר, ורק לך.</p>
    <button class="m wide" type="button" id="google" hidden>כניסה עם Google</button>
    <form id="magic" class="magic">
      <input class="sunk-in" id="email" type="email" name="email" autocomplete="email" inputmode="email" placeholder="כתובת מייל" aria-label="כתובת מייל" dir="ltr" required>
      <button class="m wide" type="submit">שליחת קישור כניסה למייל</button>
    </form>
    <p class="k" id="sheet-msg" aria-live="polite"></p>
    <button class="m wide ghost" type="button" id="sheet-close">סגירה</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
